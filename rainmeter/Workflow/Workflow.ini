;  Vision Forge Workflow - Rainmeter widget
;  Shows the top 3 projects from the Workflow app.
;  Right-click the widget for: Change photo / Size / Refresh now / Open app

[Rainmeter]
Update=1000
AccurateText=1
ContextTitle=Change photo
ContextAction=[!CommandMeasure MeasureChoosePhoto "Run"]
ContextTitle2=Refresh now
ContextAction2=[!CommandMeasure MeasureData "Update"]
ContextTitle3=Open Workflow app
ContextAction3=["#AppURL#"]
ContextTitle4=-
ContextTitle5=Size 100%
ContextAction5=[!WriteKeyValue Variables Scale "1" "#@#Variables.inc"][!Refresh]
ContextTitle6=Size 90%
ContextAction6=[!WriteKeyValue Variables Scale "0.9" "#@#Variables.inc"][!Refresh]
ContextTitle7=Size 80%
ContextAction7=[!WriteKeyValue Variables Scale "0.8" "#@#Variables.inc"][!Refresh]
ContextTitle8=Size 70%
ContextAction8=[!WriteKeyValue Variables Scale "0.7" "#@#Variables.inc"][!Refresh]
ContextTitle9=Size 60%
ContextAction9=[!WriteKeyValue Variables Scale "0.6" "#@#Variables.inc"][!Refresh]
ContextTitle10=-
ContextTitle11=Turn blur on/off (needs FrostedGlass)
ContextAction11=[!WriteKeyValue Variables Blur "[MeasureBlurNext]" "#@#Variables.inc"][!Refresh]

[Metadata]
Name=Vision Forge Workflow
Author=Vision Forge
Information=Top 3 projects from the Workflow app (Supabase). Right-click to change the photo or size.
Version=1.1
License=Inter font: SIL Open Font License (see @Resources\Fonts\LICENSE.txt)

[Variables]
@Include=#@#Variables.inc
CardTop=150,120,118,236
CardBottom=58,47,46,242
PillColor=40,32,32,105
LineColor=255,255,255,55
Text=255,255,255,255
Muted=255,255,255,175

; ---------------- styles ----------------
[sText]
FontFace=Inter
FontColor=#Text#
AntiAlias=1
FontSize=(10*#Scale#)
[sMedium]
FontFace=Inter Medium
[sMuted]
FontColor=#Muted#

; ---------------- data ----------------
[MeasureData]
Measure=WebParser
URL=#SupabaseURL#/rest/v1/projects?select=name,type,status,person&order=position.asc,created_at.asc&limit=3
Header=apikey: #SupabaseKey#
Header2=Accept: application/json
UpdateRate=30
CodePage=65001
RegExp=(?siU)^(?(?=.*\{).*\{"name":"(.*)","type":"(.*)","status":"(.*)","person":(.*)\})(?(?=.*\{).*\{"name":"(.*)","type":"(.*)","status":"(.*)","person":(.*)\})(?(?=.*\{).*\{"name":"(.*)","type":"(.*)","status":"(.*)","person":(.*)\})
FinishAction=[!UpdateMeasure MeasureSyncTime][!SetOption MeterSyncText MeasureName MeasureSyncTime][!SetOption MeterSyncText Text "Synced %1"][!UpdateMeasureGroup Rows][!UpdateMeter *][!Redraw]
OnConnectErrorAction=[!SetOption MeterSyncText Text "Offline"][!SetOption MeterSyncText MeasureName ""][!UpdateMeter *][!Redraw]
OnRegExpErrorAction=[!SetOption MeterSyncText Text "No data"][!SetOption MeterSyncText MeasureName ""][!UpdateMeter *][!Redraw]

[MeasureSyncTime]
Measure=Time
Format=%H:%M
UpdateDivider=-1

[MeasureToday]
Measure=Time
Format=%#d %B %Y

[MeasureR1Name]
Measure=WebParser
URL=[MeasureData]
StringIndex=1
Group=Rows
RegExpSubstitute=1
Substitute='\\"':'"'
IfMatch=^$
IfMatchAction=[!HideMeterGroup Row1][!ShowMeter MeterEmpty][!Redraw]
IfNotMatchAction=[!ShowMeterGroup Row1][!HideMeter MeterEmpty][!Redraw]
[MeasureR1Type]
Measure=WebParser
URL=[MeasureData]
StringIndex=2
Group=Rows
[MeasureR1Status]
Measure=WebParser
URL=[MeasureData]
StringIndex=3
Group=Rows
[MeasureR1Person]
Measure=WebParser
URL=[MeasureData]
StringIndex=4
Group=Rows
RegExpSubstitute=1
Substitute='^null$':'','^"':'','"$':''
IfMatch=^$
IfMatchAction=[!HideMeter MeterR1PersonIcon]
IfNotMatchAction=[!ShowMeter MeterR1PersonIcon]
IfMatchMode=1
[MeasureR1Color]
Measure=String
String=[MeasureR1Status]
DynamicVariables=1
Group=Rows
RegExpSubstitute=1
Substitute='^To do$':'255,95,87','^In process$':'255,197,61','^Done$':'52,199,89','^$':'255,255,255'

[MeasureR2Name]
Measure=WebParser
URL=[MeasureData]
StringIndex=5
Group=Rows
RegExpSubstitute=1
Substitute='\\"':'"'
IfMatch=^$
IfMatchAction=[!HideMeterGroup Row2][!Redraw]
IfNotMatchAction=[!ShowMeterGroup Row2][!Redraw]
[MeasureR2Type]
Measure=WebParser
URL=[MeasureData]
StringIndex=6
Group=Rows
[MeasureR2Status]
Measure=WebParser
URL=[MeasureData]
StringIndex=7
Group=Rows
[MeasureR2Person]
Measure=WebParser
URL=[MeasureData]
StringIndex=8
Group=Rows
RegExpSubstitute=1
Substitute='^null$':'','^"':'','"$':''
IfMatch=^$
IfMatchAction=[!HideMeter MeterR2PersonIcon]
IfNotMatchAction=[!ShowMeter MeterR2PersonIcon]
IfMatchMode=1
[MeasureR2Color]
Measure=String
String=[MeasureR2Status]
DynamicVariables=1
Group=Rows
RegExpSubstitute=1
Substitute='^To do$':'255,95,87','^In process$':'255,197,61','^Done$':'52,199,89','^$':'255,255,255'

[MeasureR3Name]
Measure=WebParser
URL=[MeasureData]
StringIndex=9
Group=Rows
RegExpSubstitute=1
Substitute='\\"':'"'
IfMatch=^$
IfMatchAction=[!HideMeterGroup Row3][!Redraw]
IfNotMatchAction=[!ShowMeterGroup Row3][!Redraw]
[MeasureR3Type]
Measure=WebParser
URL=[MeasureData]
StringIndex=10
Group=Rows
[MeasureR3Status]
Measure=WebParser
URL=[MeasureData]
StringIndex=11
Group=Rows
[MeasureR3Person]
Measure=WebParser
URL=[MeasureData]
StringIndex=12
Group=Rows
RegExpSubstitute=1
Substitute='^null$':'','^"':'','"$':''
IfMatch=^$
IfMatchAction=[!HideMeter MeterR3PersonIcon]
IfNotMatchAction=[!ShowMeter MeterR3PersonIcon]
IfMatchMode=1
[MeasureR3Color]
Measure=String
String=[MeasureR3Status]
DynamicVariables=1
Group=Rows
RegExpSubstitute=1
Substitute='^To do$':'255,95,87','^In process$':'255,197,61','^Done$':'52,199,89','^$':'255,255,255'

[MeasureChoosePhoto]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -STA -ExecutionPolicy Bypass -WindowStyle Hidden -File "#@#ChoosePhoto.ps1" "#@#"
State=Hide
FinishAction=[!Refresh]

[MeasureBlurNext]
Measure=Calc
Formula=1-#Blur#

[MeasureBlur]
Measure=Plugin
Plugin=FrostedGlass
Type=#BlurType#
Border=None
Disabled=(1-#Blur#)

; ---------------- card ----------------
[MeterCard]
Meter=Shape
Shape=Rectangle 0,0,(340*#Scale#),(476*#Scale#),(36*#Scale#) | Fill LinearGradient CardGrad | StrokeWidth 1 | Stroke Color 255,255,255,40
CardGrad=90 | #CardTop# ; 0.0 | 120,96,98,236 ; 0.42 | #CardBottom# ; 1.0
Shape2=Rectangle (148.0*#Scale#),(10*#Scale#),(44*#Scale#),(3*#Scale#),(1.5*#Scale#) | Fill Color 255,255,255,90 | StrokeWidth 0

; ---------------- photo ----------------
[MeterPhotoMask]
Meter=Shape
Shape=Rectangle (14*#Scale#),(24*#Scale#),(312*#Scale#),(164*#Scale#),(28*#Scale#) | Fill Color 255,255,255,255 | StrokeWidth 0

[MeterPhoto]
Meter=Image
ImageName=#Photo#
X=(14*#Scale#)
Y=(24*#Scale#)
W=(312*#Scale#)
H=(164*#Scale#)
PreserveAspectRatio=2
Container=MeterPhotoMask

[MeterPhotoGlow]
Meter=Shape
Shape=Rectangle (14*#Scale#),(24*#Scale#),(312*#Scale#),(164*#Scale#) | Fill LinearGradient GlowGrad | StrokeWidth 0
GlowGrad=90 | 255,255,255,55 ; 0.0 | 255,255,255,0 ; 0.45 | 0,0,0,0 ; 0.75 | 30,20,20,45 ; 1.0
Container=MeterPhotoMask

[MeterPhotoEdge]
Meter=Shape
Shape=Rectangle (14.5*#Scale#),(24.5*#Scale#),(311*#Scale#),(163*#Scale#),(28*#Scale#) | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color 255,255,255,45

; chips on the photo
[MeterChip1Bg]
Meter=Shape
Shape=Rectangle (30*#Scale#),(89*#Scale#),([MeterChip1Text:W]+(26*#Scale#)),(30*#Scale#),(15*#Scale#) | Fill Color 70,60,60,120 | StrokeWidth 0
DynamicVariables=1
[MeterChip1Text]
Meter=String
MeterStyle=sText
MeasureName=MeasureToday
Text=%1
X=(43*#Scale#)
Y=(104*#Scale#)
StringAlign=LeftCenter
FontSize=(9.5*#Scale#)

[MeterChip2Bg]
Meter=Shape
Shape=Rectangle ([MeterChip1Text:W]+(64*#Scale#)),(89*#Scale#),([MeterSyncText:W]+(26*#Scale#)),(30*#Scale#),(15*#Scale#) | Fill Color 70,60,60,120 | StrokeWidth 0
DynamicVariables=1
[MeterSyncText]
Meter=String
MeterStyle=sText
Text=Loading...
X=([MeterChip1Text:W]+(77*#Scale#))
Y=(104*#Scale#)
StringAlign=LeftCenter
FontSize=(9.5*#Scale#)
DynamicVariables=1

; ---------------- title ----------------
[MeterTitle]
Meter=String
MeterStyle=sText
Text=Workflow
X=(36*#Scale#)
Y=(206*#Scale#)
FontSize=(13.5*#Scale#)
LeftMouseUpAction=["#AppURL#"]
ToolTipText=Open the Workflow app

[MeterTitleLine]
Meter=Shape
Shape=Line (36*#Scale#),(236*#Scale#),(304*#Scale#),(236*#Scale#) | StrokeWidth 1 | Stroke Color #LineColor#

[MeterEmpty]
Meter=String
MeterStyle=sText | sMuted
Text=No projects yet. Add one from the app.
X=(36*#Scale#)
Y=(258*#Scale#)
FontSize=(10*#Scale#)
Hidden=1

; ---------------- row 1 ----------------
[MeterR1Name]
Meter=String
MeterStyle=sText | sMedium
MeasureName=MeasureR1Name
Text=%1
X=(36*#Scale#)
Y=(252*#Scale#)
W=(268*#Scale#)
ClipString=1
FontSize=(11.5*#Scale#)
