Shape=Ellipse ((112*#Scale#)+[MeterR1Type:W]+[MeterR1Status:W]),(289.5*#Scale#),(2.8*#Scale#) | Fill Color #Muted# | StrokeWidth 0
Shape2=Rectangle ((107*#Scale#)+[MeterR1Type:W]+[MeterR1Status:W]),(293.5*#Scale#),(10*#Scale#),(6.5*#Scale#),(3*#Scale#) | Fill Color #Muted# | StrokeWidth 0
