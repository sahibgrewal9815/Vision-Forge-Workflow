;  Vision Forge Workflow - Rainmeter widget
;  Shows the top 3 projects from the Workflow app.
;  Right-click the widget for: Change photo / Refresh now / Open app

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=0
ContextTitle=Change photo
ContextAction=[!CommandMeasure MeasureChoosePhoto "Run"]
ContextTitle2=Refresh now
ContextAction2=[!CommandMeasure MeasureData "Update"]
ContextTitle3=Open Workflow app
ContextAction3=["#AppURL#"]
ContextTitle4=-
ContextTitle5=Turn blur on/off (needs FrostedGlass)
ContextAction5=[!WriteKeyValue Variables Blur "[MeasureBlurNext]" "#@#Variables.inc"][!Refresh]

[Metadata]
Name=Vision Forge Workflow
Author=Vision Forge
Information=Top 3 projects from the Workflow app (Supabase). Right-click to change the photo.
Version=1.0
License=Inter font: SIL Open Font License (see @Resources\Fonts\LICENSE.txt)

[Variables]
@Include=#@#Variables.inc
W=340
H=476
CardTop=150,120,118,236
CardBottom=58,47,46,242
PillColor=40,32,32,105
LineColor=255,255,255,55
Text=255,255,255,255
Muted=255,255,255,175

; ---------------- styles ----------------
[sText]
FontFace=Inter
FontColor=#Text#
AntiAlias=1
FontSize=10
[sMedium]
FontFace=Inter Medium
[sMuted]
FontColor=#Muted#
FontSize=9

; ---------------- data ----------------
[MeasureData]
Measure=WebParser
URL=#SupabaseURL#/rest/v1/projects?select=name,type,status,person&order=position.asc,created_at.asc&limit=3
Header=apikey: #SupabaseKey#
Header2=Accept: application/json
UpdateRate=30
CodePage=65001
RegExp=(?siU)^(?(?=.*\{).*\{"name":"(.*)","type":"(.*)","status":"(.*)","person":(.*)\})(?(?=.*\{).*\{"name":"(.*)","type":"(.*)","status":"(.*)","person":(.*)\})(?(?=.*\{).*\{"name":"(.*)","type":"(.*)","status":"(.*)","person":(.*)\})
FinishAction=[!UpdateMeasure MeasureSyncTime][!ShowMeter MeterSyncText][!SetOption MeterSyncText MeasureName MeasureSyncTime][!SetOption MeterSyncText Text "Synced %1"][!UpdateMeasureGroup Rows][!UpdateMeterGroup Rows][!UpdateMeter *][!Redraw]
OnConnectErrorAction=[!SetOption MeterSyncText Text "Offline"][!SetOption MeterSyncText MeasureName ""][!UpdateMeter *][!Redraw]
OnRegExpErrorAction=[!SetOption MeterSyncText Text "No data"][!SetOption MeterSyncText MeasureName ""][!UpdateMeter *][!Redraw]

[MeasureSyncTime]
Measure=Time
Format=%H:%M
UpdateDivider=-1

[MeasureToday]
Measure=Time
Format=%#d %B %Y

[MeasureR1Name]
Measure=WebParser
URL=[MeasureData]
StringIndex=1
Group=Rows
RegExpSubstitute=1
Substitute='\\"':'"'
IfMatch=^$
IfMatchAction=[!HideMeterGroup Row1][!ShowMeter MeterEmpty][!Redraw]
IfNotMatchAction=[!ShowMeterGroup Row1][!HideMeter MeterEmpty][!Redraw]
[MeasureR1Type]
Measure=WebParser
URL=[MeasureData]
StringIndex=2
Group=Rows
[MeasureR1Status]
Measure=WebParser
URL=[MeasureData]
StringIndex=3
Group=Rows
[MeasureR1Person]
Measure=WebParser
URL=[MeasureData]
StringIndex=4
Group=Rows
RegExpSubstitute=1
Substitute='^null$':'','^"':'','"$':''
IfMatch=^$
IfMatchAction=[!HideMeter MeterR1PersonIcon]
IfNotMatchAction=[!ShowMeter MeterR1PersonIcon]
IfMatchMode=1
[MeasureR1Color]
Measure=String
String=[MeasureR1Status]
DynamicVariables=1
Group=Rows
RegExpSubstitute=1
Substitute='^To do$':'255,95,87','^In process$':'255,197,61','^Done$':'52,199,89','^$':'255,255,255'

[MeasureR2Name]
Measure=WebParser
URL=[MeasureData]
StringIndex=5
Group=Rows
RegExpSubstitute=1
Substitute='\\"':'"'
IfMatch=^$
IfMatchAction=[!HideMeterGroup Row2][!Redraw]
IfNotMatchAction=[!ShowMeterGroup Row2][!Redraw]
[MeasureR2Type]
Measure=WebParser
URL=[MeasureData]
StringIndex=6
Group=Rows
[MeasureR2Status]
Measure=WebParser
URL=[MeasureData]
StringIndex=7
Group=Rows
[MeasureR2Person]
Measure=WebParser
URL=[MeasureData]
StringIndex=8
Group=Rows
RegExpSubstitute=1
Substitute='^null$':'','^"':'','"$':''
IfMatch=^$
IfMatchAction=[!HideMeter MeterR2PersonIcon]
IfNotMatchAction=[!ShowMeter MeterR2PersonIcon]
IfMatchMode=1
[MeasureR2Color]
Measure=String
String=[MeasureR2Status]
DynamicVariables=1
Group=Rows
RegExpSubstitute=1
Substitute='^To do$':'255,95,87','^In process$':'255,197,61','^Done$':'52,199,89','^$':'255,255,255'

[MeasureR3Name]
Measure=WebParser
URL=[MeasureData]
StringIndex=9
Group=Rows
RegExpSubstitute=1
Substitute='\\"':'"'
IfMatch=^$
IfMatchAction=[!HideMeterGroup Row3][!Redraw]
IfNotMatchAction=[!ShowMeterGroup Row3][!Redraw]
[MeasureR3Type]
Measure=WebParser
URL=[MeasureData]
StringIndex=10
Group=Rows
[MeasureR3Status]
Measure=WebParser
URL=[MeasureData]
StringIndex=11
Group=Rows
[MeasureR3Person]
Measure=WebParser
URL=[MeasureData]
StringIndex=12
Group=Rows
RegExpSubstitute=1
Substitute='^null$':'','^"':'','"$':''
IfMatch=^$
IfMatchAction=[!HideMeter MeterR3PersonIcon]
IfNotMatchAction=[!ShowMeter MeterR3PersonIcon]
IfMatchMode=1
[MeasureR3Color]
Measure=String
String=[MeasureR3Status]
DynamicVariables=1
Group=Rows
RegExpSubstitute=1
Substitute='^To do$':'255,95,87','^In process$':'255,197,61','^Done$':'52,199,89','^$':'255,255,255'

[MeasureChoosePhoto]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -STA -ExecutionPolicy Bypass -WindowStyle Hidden -File "#@#ChoosePhoto.ps1" "#@#"
State=Hide
FinishAction=[!Refresh]

[MeasureBlurNext]
Measure=Calc
Formula=1-#Blur#

[MeasureBlur]
Measure=Plugin
Plugin=FrostedGlass
Type=#BlurType#
Border=None
Disabled=(1-#Blur#)

; ---------------- card ----------------
[MeterCard]
Meter=Shape
Shape=Rectangle 0,0,#W#,#H#,36 | Fill LinearGradient CardGrad | StrokeWidth 1 | Stroke Color 255,255,255,40
CardGrad=90 | #CardTop# ; 0.0 | 120,96,98,236 ; 0.42 | #CardBottom# ; 1.0
Shape2=Rectangle ((#W#-44)/2),10,44,3,1.5 | Fill Color 255,255,255,90 | StrokeWidth 0

; ---------------- photo ----------------
[MeterPhotoMask]
Meter=Shape
Shape=Rectangle 14,24,(#W#-28),164,28 | Fill Color 255,255,255,255 | StrokeWidth 0

[MeterPhoto]
Meter=Image
ImageName=#Photo#
X=14
Y=24
W=(#W#-28)
H=164
PreserveAspectRatio=2
Container=MeterPhotoMask
DynamicVariables=1

[MeterPhotoGlow]
Meter=Shape
Shape=Rectangle 14,24,(#W#-28),164 | Fill LinearGradient GlowGrad | StrokeWidth 0
GlowGrad=90 | 255,255,255,55 ; 0.0 | 255,255,255,0 ; 0.45 | 0,0,0,0 ; 0.75 | 30,20,20,45 ; 1.0
Container=MeterPhotoMask

[MeterPhotoEdge]
Meter=Shape
Shape=Rectangle 14.5,24.5,(#W#-29),163,28 | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color 255,255,255,45

; chips on the photo
[MeterChip1Bg]
Meter=Shape
Shape=Rectangle 30,89,([MeterChip1Text:W]+26),30,15 | Fill Color 70,60,60,120 | StrokeWidth 0
DynamicVariables=1
[MeterChip1Text]
Meter=String
MeterStyle=sText
MeasureName=MeasureToday
Text=%1
X=43
Y=104
StringAlign=LeftCenter
FontSize=9.5

[MeterChip2Bg]
Meter=Shape
Shape=Rectangle ([MeterChip1Text:W]+64),89,([MeterSyncText:W]+26),30,15 | Fill Color 70,60,60,120 | StrokeWidth 0
DynamicVariables=1
[MeterSyncText]
Meter=String
MeterStyle=sText
Text=Loading...
X=([MeterChip1Text:W]+77)
Y=104
StringAlign=LeftCenter
FontSize=9.5
DynamicVariables=1

; ---------------- title ----------------
[MeterTitle]
Meter=String
MeterStyle=sText
Text=Workflow
X=36
Y=206
FontSize=13.5
LeftMouseUpAction=["#AppURL#"]
ToolTipText=Open the Workflow app

[MeterTitleLine]
Meter=Shape
Shape=Line 36,236,304,236 | StrokeWidth 1 | Stroke Color #LineColor#

[MeterEmpty]
Meter=String
MeterStyle=sText | sMuted
Text=No projects yet. Add one from the app.
X=36
Y=258
FontSize=10
Hidden=1

; ---------------- row 1 ----------------
[MeterR1Name]
Meter=String
MeterStyle=sText | sMedium
MeasureName=MeasureR1Name
Text=%1
X=36
Y=252
W=268
ClipString=1
FontSize=11.5
Group=Row1
LeftMouseUpAction=["#AppURL#"]

[MeterR1TypeBg]
Meter=Shape
Shape=Rectangle 36,282,([MeterR1Type:W]+22),22,11 | Fill Color #PillColor# | StrokeWidth 0
DynamicVariables=1
Group=Row1
[MeterR1Type]
Meter=String
MeterStyle=sText
MeasureName=MeasureR1Type
Text=%1
X=47
Y=293
StringAlign=LeftCenter
FontSize=8.5
Group=Row1

[MeterR1StatusBg]
Meter=Shape
Shape=Rectangle (36+[MeterR1Type:W]+28),282,([MeterR1Status:W]+36),22,11 | Fill Color #PillColor# | StrokeWidth 0
Shape2=Ellipse (36+[MeterR1Type:W]+28+13),293,4 | Fill Color [MeasureR1Color],255 | StrokeWidth 0
DynamicVariables=1
Group=Row1
[MeterR1Status]
Meter=String
MeterStyle=sText
MeasureName=MeasureR1Status
Text=%1
X=(36+[MeterR1Type:W]+28+24)
Y=293
StringAlign=LeftCenter
FontSize=8.5
DynamicVariables=1
Group=Row1

[MeterR1PersonIcon]
Meter=Shape
Shape=Ellipse (36+[MeterR1Type:W]+[MeterR1Status:W]+76),289.5,2.8 | Fill Color #Muted# | StrokeWidth 0
Shape2=Rectangle (36+[MeterR1Type:W]+[MeterR1Status:W]+71),293.5,10,6.5,3 | Fill Color #Muted# | StrokeWidth 0
DynamicVariables=1
Group=Row1
[MeterR1Person]
Meter=String
MeterStyle=sText | sMuted
MeasureName=MeasureR1Person
Text=%1
X=(36+[MeterR1Type:W]+[MeterR1Status:W]+86)
Y=293
W=(304-(36+[MeterR1Type:W]+[MeterR1Status:W]+86))
ClipString=1
StringAlign=LeftCenter
FontSize=9
DynamicVariables=1
Group=Row1
[MeterR1Line]
Meter=Shape
Shape=Line 36,315,304,315 | StrokeWidth 1 | Stroke Color #LineColor#
Group=Row2

; ---------------- row 2 ----------------
[MeterR2Name]
Meter=String
MeterStyle=sText | sMedium
MeasureName=MeasureR2Name
Text=%1
X=36
Y=326
W=268
ClipString=1
FontSize=11.5
Group=Row2
LeftMouseUpAction=["#AppURL#"]

[MeterR2TypeBg]
Meter=Shape
Shape=Rectangle 36,356,([MeterR2Type:W]+22),22,11 | Fill Color #PillColor# | StrokeWidth 0
