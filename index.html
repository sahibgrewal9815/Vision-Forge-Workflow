<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workflow">
<meta name="theme-color" content="#5a4a46">
<title>Workflow</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
  :root{
    --glass: rgba(70,56,54,.42);
    --glass-strong: rgba(58,47,46,.62);
    --line: rgba(255,255,255,.22);
    --pill: rgba(40,32,32,.38);
    --text: #fff;
    --muted: rgba(255,255,255,.68);
    --red:#ff5f57; --yellow:#ffc53d; --green:#34c759;
    --safe-top: env(safe-area-inset-top);
    --safe-bottom: env(safe-area-inset-bottom);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#5a4a46;color:var(--text);
    font-family:Inter,-apple-system,"SF Pro Text",system-ui,sans-serif;font-weight:400;
    -webkit-font-smoothing:antialiased}
  body{overflow-x:hidden}
  .bg{position:fixed;inset:0;z-index:-2;background:#8a6f6a center/cover no-repeat;transform:scale(1.04)}
  .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(30,20,20,.35))}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  input,textarea{font:inherit;color:var(--text)}

  .wrap{max-width:520px;margin:0 auto;padding:calc(var(--safe-top) + 18px) 16px calc(var(--safe-bottom) + 110px)}

  .card{position:relative;border-radius:44px;padding:14px;
    background:linear-gradient(180deg,rgba(150,120,118,.38) 0%,var(--glass) 45%,var(--glass-strong) 100%);
    -webkit-backdrop-filter:blur(26px) saturate(120%);backdrop-filter:blur(26px) saturate(120%);
    box-shadow:0 30px 60px rgba(30,15,15,.25), inset 0 1px 0 rgba(255,255,255,.18)}
  .grab{width:44px;height:3px;border-radius:3px;background:rgba(255,255,255,.35);margin:2px auto 12px}

  .hero{position:relative;height:178px;border-radius:32px;overflow:hidden;background:#8a6f6a center/cover}
  .hero::after{content:"";position:absolute;inset:0;border-radius:32px;
    box-shadow:inset 0 0 40px rgba(255,255,255,.18);background:linear-gradient(180deg,rgba(255,255,255,.12),transparent 40%)}
  .hero .chips{position:absolute;left:14px;right:14px;top:50%;transform:translateY(-50%);display:flex;gap:8px;z-index:1;flex-wrap:nowrap;overflow:hidden}
  .hero .photo-btn{position:absolute;right:12px;top:12px;z-index:2;width:34px;height:34px;border-radius:50%;
    background:var(--pill);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);display:grid;place-items:center}
  .chip{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;font-size:13.5px;
    background:rgba(70,60,60,.38);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#fff;white-space:nowrap}
  .chip svg{width:15px;height:15px;opacity:.9}

  .section{padding:22px 28px 8px}
  .section h2{margin:0;font-size:19px;font-weight:400;letter-spacing:.1px;display:flex;justify-content:space-between;align-items:center}
  .divider{height:1px;background:var(--line);margin:18px 0 6px}

  .list{list-style:none;margin:0;padding:0 14px 6px}
  .item{display:flex;align-items:center;gap:10px;padding:14px 14px;border-radius:24px;transition:background .2s, transform .25s}
  .item:active{background:rgba(255,255,255,.06)}
  .item .main{flex:1;min-width:0}
  .item .name{font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .meta{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .tag{font-size:12.5px;padding:5px 11px;border-radius:999px;background:var(--pill);color:#fff;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
  .dot.todo{background:var(--red)} .dot.inprocess{background:var(--yellow)} .dot.done{background:var(--green)}
  .person{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:5px;margin-left:2px}
  .arrows{display:flex;flex-direction:column;gap:6px}
  .arrows button{width:34px;height:30px;border-radius:12px;background:var(--pill);display:grid;place-items:center}
  .arrows button:disabled{opacity:.25}
  .arrows svg{width:14px;height:14px}
  .rank{width:22px;font-size:13px;color:var(--muted);text-align:center;flex:none}
  .desk-sep{display:flex;align-items:center;gap:10px;margin:6px 14px;font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
  .desk-sep::before,.desk-sep::after{content:"";flex:1;height:1px;background:var(--line)}
  .empty{padding:30px 28px 26px;color:var(--muted);font-size:15px;line-height:1.5}

  .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-bottom) + 26px);
    padding:16px 40px;border-radius:999px;background:#fff;color:#1d1b1b;font-size:17px;font-weight:500;
    box-shadow:0 12px 30px rgba(0,0,0,.25);z-index:5}

  /* sheet */
  .scrim{position:fixed;inset:0;background:rgba(20,12,12,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
  .scrim.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-width:520px;margin:0 auto;
    transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
    padding:0 10px calc(var(--safe-bottom) + 10px)}
  .sheet.open{transform:none}
  .sheet .card{max-height:calc(100vh - var(--safe-top) - 30px);overflow:auto;padding-bottom:22px;
    background:linear-gradient(180deg,rgba(120,96,94,.75),rgba(62,50,49,.86))}
  .sheet h3{margin:6px 0 0;font-size:19px;font-weight:400;padding:0 14px}
  .field{padding:0 14px;margin-top:16px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
  .field input,.field textarea{width:100%;border:0;outline:0;border-radius:18px;padding:13px 16px;font-size:16px;
    background:rgba(30,24,24,.35)}
  .field textarea{min-height:90px;resize:vertical}
  .field input::placeholder,.field textarea::placeholder{color:rgba(255,255,255,.4)}
  input[type=date]{-webkit-appearance:none;appearance:none;min-height:46px}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;padding:12px 6px;border-radius:999px;background:rgba(30,24,24,.35);font-size:14.5px;white-space:nowrap;opacity:.75;transition:all .2s;border:1.5px solid transparent}
  .seg button.on{opacity:1;background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.45)}
  .status button{display:flex;align-items:center;justify-content:center;gap:7px;color:#fff}
  .status button[data-v="To do"].on{background:var(--red);border-color:var(--red);color:#fff}
  .status button[data-v="In process"].on{background:var(--yellow);border-color:var(--yellow);color:#2a2316}
  .status button[data-v="Done"].on{background:var(--green);border-color:var(--green);color:#0f2a16}
  .status button.on .dot{background:currentColor;opacity:.55}
  .actions{display:flex;gap:10px;padding:0 14px;margin-top:24px}
  .btn{flex:1;padding:15px;border-radius:999px;font-size:16px;font-weight:500}
  .btn.primary{background:#fff;color:#1d1b1b}
  .btn.ghost{background:rgba(30,24,24,.35)}
  .btn.danger{background:rgba(255,95,87,.22);color:#ffb3ae;flex:0 0 auto;padding:15px 20px}

  .toast{position:fixed;left:50%;top:calc(var(--safe-top) + 14px);transform:translate(-50%,-140%);transition:transform .3s;
    background:rgba(40,32,32,.8);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:10px 18px;border-radius:999px;font-size:14px;z-index:20}
  .toast.show{transform:translate(-50%,0)}
  .spin{animation:spin 1s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="bg" id="bg"></div>

<div class="wrap">
  <div class="card">
    <div class="grab"></div>
    <div class="hero" id="hero">
      <button class="photo-btn" id="photoBtn" aria-label="Change photo">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="3"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8 5l1.5-2h5L16 5"/></svg>
      </button>
      <div class="chips">
        <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span id="today"></span></span>
        <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span id="countChip">–</span></span>
      </div>
    </div>

    <div class="section">
      <h2><span>Workflow</span>
        <button id="refreshBtn" aria-label="Refresh" style="opacity:.8">
          <svg id="refreshIcon" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4.5h-4.5"/></svg>
        </button>
      </h2>
      <div class="divider"></div>
    </div>
    <ul class="list" id="list"></ul>
  </div>
</div>

<button class="fab" id="addBtn">New project</button>
<input type="file" id="photoInput" accept="image/*" hidden>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="card">
    <div class="grab"></div>
    <h3 id="sheetTitle">Project details</h3>
    <div class="divider" style="margin:16px 14px 0"></div>
    <div class="field"><label>Project name</label><input id="f_name" placeholder="e.g. MB041" autocomplete="off"></div>
    <div class="field"><label>Type</label>
      <div class="seg" id="f_type"><button data-v="Change">Change</button><button data-v="New">New</button></div></div>
    <div class="field"><label>Status</label>
      <div class="seg status" id="f_status">
        <button data-v="To do"><span class="dot todo"></span>To do</button>
        <button data-v="In process"><span class="dot inprocess"></span>In process</button>
        <button data-v="Done"><span class="dot done"></span>Done</button>
      </div></div>
    <div class="field"><label>Who's working on it</label><input id="f_person" placeholder="Name" autocomplete="off"></div>
    <div class="field"><label>Client name</label><input id="f_client" placeholder="Client" autocomplete="off"></div>
    <div class="field"><label>Deadline</label><input id="f_deadline" type="date"></div>
    <div class="field"><label>Notes</label><textarea id="f_notes" placeholder="Anything to remember"></textarea></div>
    <div class="actions">
      <button class="btn danger" id="delBtn">Delete</button>
      <button class="btn ghost" id="cancelBtn">Cancel</button>
      <button class="btn primary" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const CFG = window.WORKFLOW_CONFIG || {};
  const API = (CFG.SUPABASE_URL||"").replace(/\/$/,"") + "/rest/v1/projects";
  const HEAD = {"apikey": CFG.SUPABASE_KEY, "Content-Type":"application/json"};
  const $ = s => document.getElementById(s);
  const STATUS_CLASS = {"To do":"todo","In process":"inprocess","Done":"done"};
  let items = [], editing = null, busy = false;

  /* ---------- helpers ---------- */
  function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200); }
  function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  async function api(path, opts={}){
    const r = await fetch(API + path, {...opts, headers:{...HEAD, ...(opts.headers||{})}});
    if(!r.ok){ throw new Error((await r.text()) || r.statusText); }
    return r.status===204 ? null : r.json();
  }
  function fmtDate(d){ if(!d) return ""; const x=new Date(d+"T00:00:00"); return x.toLocaleDateString(undefined,{day:"numeric",month:"short"}); }

  /* ---------- background photo (saved on this phone) ---------- */
  function applyPhoto(){
    let src = "bg.jpg";
    try{ src = localStorage.getItem("wf_photo") || src; }catch(e){}
    $("bg").style.backgroundImage = `url("${src}")`;
    $("hero").style.backgroundImage = `url("${src}")`;
  }
  $("photoBtn").onclick = () => $("photoInput").click();
  $("photoInput").onchange = e => {
    const file = e.target.files[0]; if(!file) return;
    const img = new Image();
    img.onload = () => {
      const max = 1400, k = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement("canvas"); c.width = img.width*k; c.height = img.height*k;
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      const data = c.toDataURL("image/jpeg",.82);
      try{ localStorage.setItem("wf_photo",data); }catch(err){ toast("Photo too big to save"); }
      applyPhoto(); URL.revokeObjectURL(img.src); toast("Photo updated");
    };
    img.src = URL.createObjectURL(file);
    e.target.value = "";
  };

  /* ---------- list ---------- */
  function render(){
    const ul = $("list");
    const active = items.filter(p=>p.status!=="Done").length;
    $("countChip").textContent = items.length ? `${active} Active · ${items.length} Total` : "No projects";
    if(!items.length){ ul.innerHTML = `<li class="empty">No projects yet. Tap <b>New project</b> to add your first one. The top 3 will show on your desktop widget.</li>`; return; }
    let html = "";
    items.forEach((p,i)=>{
      html += `<li class="item" data-i="${i}">
        <div class="rank">${i+1}</div>
        <div class="main">
          <div class="name">${esc(p.name)||"Untitled"}</div>
          <div class="meta">
            <span class="tag">${esc(p.type||"New")}</span>
            <span class="tag"><span class="dot ${STATUS_CLASS[p.status]||"todo"}"></span>${esc(p.status||"To do")}</span>
            ${p.person?`<span class="person"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>${esc(p.person)}</span>`:""}
            ${p.deadline?`<span class="person">· ${fmtDate(p.deadline)}</span>`:""}
          </div>
        </div>
        <div class="arrows">
          <button data-move="-1" ${i===0?"disabled":""} aria-label="Move up"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
          <button data-move="1" ${i===items.length-1?"disabled":""} aria-label="Move down"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
        </div>
      </li>`;
      if(i===2 && items.length>3) html += `<li class="desk-sep">Above this line shows on desktop</li>`;
    });
    ul.innerHTML = html;
  }

  $("list").addEventListener("click", e=>{
    const li = e.target.closest(".item"); if(!li) return;
    const i = +li.dataset.i;
    const mv = e.target.closest("[data-move]");
    if(mv){ e.stopPropagation(); move(i, +mv.dataset.move); return; }
    openSheet(items[i]);
  });

  async function load(silent){
    if(!CFG.SUPABASE_URL || CFG.SUPABASE_URL.startsWith("PASTE")){ $("list").innerHTML=`<li class="empty">App not connected yet: add the Supabase details in <b>config.js</b>.</li>`; return; }
    if(busy) return;
    $("refreshIcon").classList.add("spin");
    try{
      items = await api("?select=*&order=position.asc,created_at.asc");
      render();
    }catch(err){ if(!silent) toast("Couldn't load. Check internet."); console.error(err); }
    finally{ $("refreshIcon").classList.remove("spin"); }
  }

  async function move(i, dir){
    const j = i + dir; if(j<0 || j>=items.length || busy) return;
    busy = true;
    // renumber everything so positions are always clean, then swap
    [items[i], items[j]] = [items[j], items[i]];
    render();
    try{
      const changed = [];
      items.forEach((p,k)=>{ if(p.position!==k){ p.position=k; changed.push(p); } });
      await Promise.all(changed.map(p=>api(`?id=eq.${p.id}`,{method:"PATCH",body:JSON.stringify({position:p.position})})));
    }catch(err){ toast("Couldn't save order"); console.error(err); }
    finally{ busy = false; }
  }

  /* ---------- sheet ---------- */
  function setSeg(id, v){ [...$(id).children].forEach(b=>b.classList.toggle("on", b.dataset.v===v)); }
  function getSeg(id){ const b=$(id).querySelector(".on"); return b?b.dataset.v:null; }
  ["f_type","f_status"].forEach(id=>$(id).addEventListener("click",e=>{ const b=e.target.closest("button"); if(b) setSeg(id,b.dataset.v); }));

  function openSheet(p){
    editing = p || null;
    $("sheetTitle").textContent = p ? "Project details" : "New project";
    $("f_name").value = p?.name || "";
    $("f_person").value = p?.person || "";
    $("f_client").value = p?.client || "";
    $("f_deadline").value = p?.deadline || "";
    $("f_notes").value = p?.notes || "";
    setSeg("f_type", p?.type || "New");
    setSeg("f_status", p?.status || "To do");
    $("delBtn").style.display = p ? "" : "none";
    $("scrim").classList.add("open"); $("sheet").classList.add("open");
  }
  function closeSheet(){ $("scrim").classList.remove("open"); $("sheet").classList.remove("open"); editing=null; document.activeElement?.blur(); }
  $("scrim").onclick = closeSheet; $("cancelBtn").onclick = closeSheet;
  $("addBtn").onclick = () => openSheet(null);

  $("saveBtn").onclick = async () => {
    const data = {
      name: $("f_name").value.trim(),
      type: getSeg("f_type"),
      status: getSeg("f_status"),
      person: $("f_person").value.trim() || null,
      client: $("f_client").value.trim() || null,
      deadline: $("f_deadline").value || null,
      notes: $("f_notes").value.trim() || null
    };
    if(!data.name){ toast("Add a project name"); $("f_name").focus(); return; }
    try{
      if(editing){
        await api(`?id=eq.${editing.id}`,{method:"PATCH",body:JSON.stringify(data)});
      }else{
        data.position = items.length ? Math.max(...items.map(p=>p.position||0)) + 1 : 0;
        await api("",{method:"POST",body:JSON.stringify(data),headers:{Prefer:"return=minimal"}});
      }
      closeSheet(); toast("Saved"); load();
    }catch(err){ toast("Couldn't save"); console.error(err); }
  };

  $("delBtn").onclick = async () => {
    if(!editing) return;
    if(!confirm(`Delete ${editing.name}? This can't be undone.`)) return;
    try{ await api(`?id=eq.${editing.id}`,{method:"DELETE"}); closeSheet(); toast("Deleted"); load(); }
    catch(err){ toast("Couldn't delete"); console.error(err); }
  };

  $("refreshBtn").onclick = () => load();

  /* ---------- start ---------- */
  $("today").textContent = new Date().toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
  applyPhoto();
  load();
  setInterval(()=>{ if(!document.hidden && !$("sheet").classList.contains("open")) load(true); }, 20000);
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) load(true); });
})();
</script>
</body>
</html>
